name: CI
on:
  pull_request:
    branches: [dev, main, 002-poc-lead-scoring]
  workflow_dispatch:
jobs:
  agent-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-demo.txt
      - name: Install isolated demo dependencies
        run: pip install -r backend/requirements-demo.txt
      - name: Run tests and regression scenarios
        env:
          PYTHONPATH: backend/src
          DEMO_PROVIDER: offline
        run: |
          mkdir -p artifacts
          pytest backend/tests -q --junitxml=artifacts/junit.xml
          python -m interview_demo.evaluate --output artifacts/regression
      - name: Retain test and agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-regression-evidence
          path: artifacts/
