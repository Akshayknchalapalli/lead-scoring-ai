[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scoring-backend"
version = "0.1.0"
description = "Backend service for lead scoring platform."
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "langgraph>=1,<2",
  "uvicorn[standard]",
  "sqlalchemy",
  "pydantic",
  "redis",
  "pyyaml",
  "pytest",
  "alembic",
  "pandas",
  "pyarrow",
  "xgboost",
  "scikit-learn",
]
